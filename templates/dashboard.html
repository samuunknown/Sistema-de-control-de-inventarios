<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">📦 Inventario</span>
    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-3">
      {% csrf_token %}
      <span class="text-white">Hola, {{ user.username }}</span>
      <button class="btn btn-outline-light btn-sm">Salir</button>
    </form>
  </nav>
  <div class="container mt-4">
    <h2>Panel principal</h2>
    <p class="text-muted">Aquí irán las métricas del inventario.</p>
  </div>
</body>
</html>
